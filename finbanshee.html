<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FinBanshee staging storefront.">
    <title>FinBanshee Staging Storefront - Beta Staging</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-bg-base: #0b0f19;
            --color-primary: #6366f1;
            --color-text-main: #f9fafb;
            --color-text-muted: #9ca3af;
            --font-main: 'Outfit', sans-serif;
        }
        body {
            background-color: var(--color-bg-base);
            color: var(--color-text-main);
            font-family: var(--font-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            background-image: radial-gradient(at 50% 50%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
        }
        .container {
            max-width: 500px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #a5b4fc, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background: var(--color-primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FinBanshee Staging portal</h1>
        <p>You have successfully deployed FinBanshee static web assets to franktest.xyz.</p>
        <a href="finbanshee/index.html" class="btn">Launch FinBanshee Staging Staging</a>
    </div>
</body>
</html>
