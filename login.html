<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your franktest.xyz administrator account.">
    <title>Sign In - franktest.xyz</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="glow-bg"></div>
    <div class="grid-overlay"></div>

    <!-- Navigation Header -->
    <header class="navbar" id="main-nav">
        <div class="container navbar-container">
            <a href="index.html" class="logo" id="logo-link">
                <span class="logo-dot"></span>franktest.xyz
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link" id="nav-home-link">Home</a>
            </nav>
        </div>
    </header>

    <!-- Login Area -->
    <main class="login-page">
        <div class="login-card" id="login-container">
            <div class="login-header">
                <h1 class="login-title" id="login-heading">Test Portal</h1>
                <p class="login-subtitle" id="login-subheading">Sign in to test SAAS features</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" required placeholder="e.g. sadminwa" autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••" autocomplete="current-password">
                </div>
                
                <div class="error-message" id="error-alert">
                    Invalid username or password. Please try again.
                </div>
                
                <button type="submit" class="btn btn-primary form-btn" id="login-submit-btn">
                    Authenticate
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="main-footer">
        <div class="container footer-container">
            <p class="copyright" id="footer-copyright">&copy; 2026 franktest.xyz. All rights reserved.</p>
            <div class="footer-links">
                <span class="domain-text">www.franktest.xyz</span>
            </div>
        </div>
    </footer>

    <!-- Login Logic Script -->
    <script>
        // Check if user is already logged in, redirect directly to their dashboard/portal
        if (sessionStorage.getItem("sadmin_token") === "active") {
            const role = sessionStorage.getItem("sadmin_role");
            if (role === "admin") {
                window.location.href = "dashboard.html";
            } else if (role === "tester") {
                window.location.href = "test_portal.html";
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const usernameInput = document.getElementById("username");
            const passwordInput = document.getElementById("password");
            const errorAlert = document.getElementById("error-alert");
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            // Pre-seed default databases if they do not exist in localStorage
            if (!localStorage.getItem("admin_db")) {
                const defaultAdminDb = {
                    "sadminwa": "sadminwa",
                    "sadmin": "sadmin"
                };
                const defaultAdminRoles = {
                    "sadminwa": "Highest System Administrator",
                    "sadmin": "QA release task management"
                };
                localStorage.setItem("admin_db", JSON.stringify(defaultAdminDb));
                localStorage.setItem("admin_roles", JSON.stringify(defaultAdminRoles));
            }
            if (!localStorage.getItem("tester_db")) {
                const defaultTesterDb = {};
                const defaultAssignments = {};
                for (let i = 1; i <= 10; i++) {
                    const id = "tester" + (i < 10 ? "0" + i : i);
                    defaultTesterDb[id] = "tester";
                    defaultAssignments[id] = (i === 1) ? "FinCommerce" : "None";
                }
                localStorage.setItem("tester_db", JSON.stringify(defaultTesterDb));
                localStorage.setItem("tester_assignments", JSON.stringify(defaultAssignments));
            }
            if (!localStorage.getItem("project_db")) {
                const defaultProjects = ["None", "project1", "FinCommerce", "Commerce API", "FinCommerce Analytics"];
                const defaultDetails = {
                    "project1": "FinCommerce multi-channel seller portal app integration staging build",
                    "FinCommerce": "Beta staging storefront suite",
                    "Commerce API": "Developer interface payment gateway",
                    "FinCommerce Analytics": "User metrics collection sync logs"
                };
                localStorage.setItem("project_db", JSON.stringify(defaultProjects));
                localStorage.setItem("project_details", JSON.stringify(defaultDetails));
            }

            const adminDb = JSON.parse(localStorage.getItem("admin_db"));
            const testerDb = JSON.parse(localStorage.getItem("tester_db"));

            let authenticated = false;
            let role = "";

            if (adminDb[username] && adminDb[username] === password) {
                authenticated = true;
                role = "admin";
            } else if (testerDb[username] && (testerDb[username] === password || (password === "password-tester" && testerDb[username] === "tester"))) {
                authenticated = true;
                role = "tester";
            }

            
            if (authenticated) {
                // Clear error styling
                usernameInput.classList.remove("is-invalid");
                passwordInput.classList.remove("is-invalid");
                errorAlert.style.display = "none";
                
                // Store session token and role
                sessionStorage.setItem("sadmin_token", "active");
                sessionStorage.setItem("sadmin_user", username);
                sessionStorage.setItem("sadmin_role", role);
                
                // Redirect based on role
                if (role === "admin") {
                    window.location.href = "dashboard.html";
                } else {
                    window.location.href = "test_portal.html";
                }
            } else {
                // Highlight fields and show error alert
                usernameInput.classList.add("is-invalid");
                passwordInput.classList.add("is-invalid");
                errorAlert.style.display = "block";
                
                // Clear password input
                passwordInput.value = "";
            }
        }
    </script>
</body>
</html>
