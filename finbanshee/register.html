<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | FinBanshee SaaS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .register-container {
      max-width: 480px;
      margin: 4rem auto;
      padding: 0 1rem;
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="glass-card">
      <h2 style="text-align: center; margin-bottom: 0.5rem;">Create Account</h2>
      <p style="text-align: center; margin-bottom: 2rem; font-size: 0.9rem;">Sign up to launch your business ledger</p>
      
      <div id="clerk-signup-widget" style="display: none; justify-content: center; margin-bottom: 1.5rem;"></div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <input class="form-input" type="text" id="reg-username" placeholder="e.g. somchai" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input class="form-input" type="email" id="reg-email" placeholder="e.g. somchai@gmail.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input class="form-input" type="password" id="reg-password" placeholder="Min. 8 characters" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Register Account</button>
      </form>

      <p style="text-align: center; font-size: 0.85rem; color: var(--color-text-muted); margin-top: 1.5rem;">
        Already registered? <a href="index.html" style="color: var(--color-primary); text-decoration: none;">Sign In</a>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
